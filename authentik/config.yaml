---
name: "Authentik"
description: "Identity Provider / SSO self-hosted, pensado como frontend de autenticación para Nginx Proxy Manager"
version: "0.2.1"
slug: "authentik"
url: "https://github.com/sebabordon/ha-repo/tree/main/authentik"
stage: experimental
init: false
arch:
  - aarch64
  - amd64
homeassistant_api: false
startup: services
watchdog: "tcp://[HOST]:[PORT:9000]"
documentation: true
options:
  authentik_host: "auth.example.com"
  additional_domains: ""
  cookie_domain: ""
  bootstrap_email: "admin@example.com"
  bootstrap_password: ""
  trusted_proxy_cidrs: "172.30.32.0/23"
  log_level: "info"
  error_reporting: false
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_use_tls: true
  smtp_from: ""
schema:
  authentik_host: str
  additional_domains: str?
  cookie_domain: str?
  bootstrap_email: str
  bootstrap_password: password
  trusted_proxy_cidrs: str
  log_level: list(debug|info|warning|error)
  error_reporting: bool
  smtp_host: str?
  smtp_port: port?
  smtp_username: str?
  smtp_password: password?
  smtp_use_tls: bool
  smtp_from: str?
map:
  - data:rw
ports:
  9000/tcp: 9000
  9443/tcp: 9443
ports_description:
  9000/tcp: "Authentik HTTP — usar este puerto como upstream en Nginx Proxy Manager"
  9443/tcp: "Authentik HTTPS interno (certificado autofirmado, normalmente no se usa si NPM termina TLS)"
ingress: false
