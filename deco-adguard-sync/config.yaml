name: "Deco → AdGuard Sync"
description: >
  Automatically syncs connected clients from your TP-Link Deco XE75 Pro
  to AdGuard Home using both APIs. Runs on startup and every 6 hours.
  Only devices with an IP >= min_ip_suffix are exported (e.g. 100 means
  only IPs like 10.x.x.100 and above). Deco takes precedence over AdGuard:
  existing clients (matched by fixed MAC or by name) get their IP updated
  and the old one removed. New devices with a randomized privacy MAC are
  not added as new clients. Any AdGuard client inside network_cidr (not
  only the ones this add-on created) that's no longer seen on the Deco
  for more than stale_days is removed from AdGuard.
version: "1.2.1"
slug: "deco-adguard-sync"
init: false
arch:
  - aarch64
  - armv7
  - amd64
homeassistant_api: false
hassio_api: false

options:
  # URL of your main Deco node (the one you log into)
  deco_host: "https://10.0.2.1"

  # Local admin password for the Deco (set in the Deco app under More → Local Management)
  deco_pass: ""

  # URL of your AdGuard Home instance, including port
  agh_host: "https://10.0.2.232:3002"

  # AdGuard Home username
  agh_user: "admin"

  # AdGuard Home password
  agh_pass: ""

  # Only export devices whose IP last octet is >= this value.
  # Example: 100 means only IPs ending in .100 or higher are exported.
  # Use this to exclude infrastructure devices (router, APs, switches)
  # which typically have low IPs like .1, .2, etc.
  min_ip_suffix: 100

  # Run a sync immediately when the add-on starts.
  # After that, syncs automatically every 6 hours.
  run_on_start: true

  # Days a client can go unseen on the Deco before it's removed from
  # AdGuard Home. Applies to ANY AdGuard client whose IP/CIDR falls
  # inside network_cidr, not just the ones this add-on created — set
  # to 0 to disable automatic cleanup.
  stale_days: 7

  # Network managed by this sync, in CIDR notation. Only AdGuard clients
  # identified by an IP/CIDR inside this range are candidates for the
  # stale cleanup above; anything outside it (or identified only by MAC
  # or ClientID) is never touched.
  network_cidr: "10.0.2.0/23"

  # Skip creating new AdGuard clients for devices whose MAC looks like a
  # randomized privacy address (common on iOS/Android per-network MAC
  # randomization), since they cause false positives. Existing clients
  # matched by name are still updated normally.
  exclude_random_mac: true

schema:
  deco_host: str
  deco_pass: password
  agh_host: str
  agh_user: str
  agh_pass: password
  min_ip_suffix: int
  run_on_start: bool
  stale_days: int
  exclude_random_mac: bool
  network_cidr: str
