worker_processes 1;
pid /var/run/nginx-ingress.pid;
error_log /dev/stdout warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    map $http_upgrade $conn_upgrade { default upgrade; "" ""; }

    server {
        # HA Ingress connects here; it sets X-Ingress-Path to the dynamic
        # /api/hassio_ingress/<token> prefix. calibre-web reads X-Script-Name
        # (and CWA's ProxyFix reads X-Forwarded-Prefix) - translate both.
        listen 8099;

        location / {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header X-Script-Name $http_x_ingress_path;
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conn_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
