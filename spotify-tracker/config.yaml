name: "Spotify Liked Songs Tracker"
description: "Tracks your Spotify liked songs weekly and shows what disappeared"
version: "1.2.0"
slug: "spotify-tracker"
init: false
arch:
  - aarch64
  - amd64
homeassistant_api: false
options:
  spotify_client_id: ""
  spotify_client_secret: ""
  redirect_uri: "http://192.168.1.100:8765/callback"
  scan_day: "sunday"
  scan_hour: 0
  auth_user: ""
  auth_pass: ""
  oidc_enabled: false
  oidc_issuer: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  disable_local_login: false
schema:
  spotify_client_id: str
  spotify_client_secret: str
  redirect_uri: url
  scan_day: list(monday|tuesday|wednesday|thursday|friday|saturday|sunday)
  scan_hour: int(0,23)
  auth_user: str?
  auth_pass: password?
  oidc_enabled: bool
  oidc_issuer: str?
  oidc_client_id: str?
  oidc_client_secret: str?
  disable_local_login: bool
map:
  - data:rw
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: "Web interface"
